spring:
  datasource:
    url: jdbc:h2:mem:aftercommitdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.aftercommit: DEBUG
    org.springframework.transaction.event: DEBUG
    org.springframework.context.event: DEBUG